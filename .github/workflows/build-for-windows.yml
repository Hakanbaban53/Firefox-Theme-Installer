name: Build Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter tk pillow requests pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile .\main.py --icon=../Firefox-Theme-Installer/assets/icons/firefox.ico --add-data "..\Firefox-Theme-Installer\assets:assets" --add-data "..\Firefox-Theme-Installer\language:language" --add-data "..\Firefox-Theme-Installer\data\local:data\local" --noconsole

      - name: Install Windows SDK
        run: |
          choco install windows-sdk-10.0 --confirm
        shell: powershell

      - name: Create self-signed certificate
        run: |
          openssl req -x509 -newkey rsa:4096 -keyout key.pem -out cert.pem -days 365 -nodes -subj "/CN=RealFire"
          openssl pkcs12 -export -out cert.pfx -inkey key.pem -in cert.pem -passout pass:password

      - name: Sign the executable
        run: |
          $env:PATH += ";C:\Program Files (x86)\Windows Kits\10\bin\x64"
          signtool sign /f cert.pfx /p password /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\main.exe
        shell: powershell

      - uses: actions/upload-artifact@v4
        with:
          name: Firefox-Theme-Installer
          path: dist\main.exe

      - name: Extract Release Info
        id: release_info
        run: |
          # Extract version number from the tag
          VERSION=$(echo ${GITHUB_REF#refs/tags/} | sed 's/^[Vv]//')
          TAG=${GITHUB_REF/refs\/tags\//}

          # Extract commit message and extended description
          COMMIT_MESSAGE=$(git log -1 --pretty=format:%s)
          EXTENDED_DESCRIPTION=$(git log -1 --pretty=format:%b)

          # Format the release notes
          if [ -z "$EXTENDED_DESCRIPTION" ]; then
            BODY="### Release Notes:
            **$COMMIT_MESSAGE**"
          else
            BODY="### Release Notes:
            **$COMMIT_MESSAGE**
            $EXTENDED_DESCRIPTION"
          fi

          # Write outputs to GITHUB_OUTPUT for later steps
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "BODY<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@master
        env:
          GITHUB_TOKEN: ${{ secrets.RFGITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.TAG }}
          release_name: Release ${{ steps.release_info.outputs.TAG }}
          body: ${{ steps.release_info.outputs.BODY }}
          draft: false
          prerelease: false

      - name: Upload Windows Executable
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RFGITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./Firefox-Theme-Installer.exe
          asset_name: Firefox-Theme-Installer.exe
          asset_content_type: application/x-msdownload
